[project]
name = "phase-shift"
version = "0.1.0"
description = "Phase extraction from phase-shifted interferogram stacks"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "RodionovSA", email = "sergeyrodionov93@gmail.com" }]
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "numpy>=2.5.1",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
# Optional GPU backend; retained from holoeml-processing. Choose a CUDA
# wheel compatible with your GPU and driver. CPU use requires no CuPy.
cuda = ["cupy-cuda12x>=13.0,<15"]
# Notebook kernel and plotting for running scripts/*.ipynb in an IDE.
jupyter = ["ipykernel>=6", "matplotlib>=3.8"]

[project.urls]
Repository = "https://github.com/RodionovSA/phase-shift"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/phase_shift", "src/simulator"]

[tool.hatch.build.targets.sdist]
include = ["src/phase_shift", "src/simulator", "tests", "docs", "examples", "README.md", "LICENSE", "pyproject.toml", "uv.lock", ".python-version"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
