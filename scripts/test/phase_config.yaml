# PhaseSolver configuration (see phase_shift.config.PhaseConfig)
#
# Precision is not a config field: pass it to the solver alongside the device,
# e.g. PhaseSolver(cfg, device="cuda", precision="fast"), or set the
# package-wide default with phase_shift.set_precision(...).

# Per-frame normalization
use_alpha: true   # divide out alpha_n before solving

# Gain
gain_mode: joint   # fit g_n jointly inside the method's own iteration ("none" fixes g_n=1)
g: null            # precomputed gain array; overrides gain_mode when set

# Method
method: vp_aia
method_kwargs: {"iters": 30, "tol": 1.0e-4, "basis_kwargs": {"degree": 2}, "rounds": 1}
